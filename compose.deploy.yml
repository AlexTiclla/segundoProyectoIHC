name: mascota-al-dia

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        URL_BASE: http://backend:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      URL_BASE: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web
      - api
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      URL_BASE_DATOS: sqlite:////datos/mascota-al-dia.db
      SECRETO_JWT: ${SECRETO_JWT:?Define SECRETO_JWT en el archivo de entorno}
      MINUTOS_SESION: ${MINUTOS_SESION:-120}
      MINUTOS_CODIGO_RECUPERACION: ${MINUTOS_CODIGO_RECUPERACION:-15}
      NOMBRE_COOKIE: sesion
      ENTORNO: ${ENTORNO:-desarrollo}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-false}
      RECUPERACION_SIMULADA: ${RECUPERACION_SIMULADA:-true}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/La_Paz}
    expose:
      - "8000"
    volumes:
      - sqlite_data:/datos
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - api
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 384m

networks:
  web:
    name: mascota-al-dia-web
  api:
    name: mascota-al-dia-api
    internal: true

volumes:
  sqlite_data:
    name: mascota-al-dia-sqlite
  caddy_data:
    name: mascota-al-dia-caddy-data
  caddy_config:
    name: mascota-al-dia-caddy-config

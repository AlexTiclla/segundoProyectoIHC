name: Pruebas
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (pytest)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Instalar dependencias
      working-directory: backend
      run: pip install -r requirements.txt
    - name: Correr pytest
      working-directory: backend
      run: python -m pytest -q

  e2e:
    name: E2E (Playwright, 3 navegadores)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # playwright.config.ts levanta el backend con backend/.venv y el frontend con
    # "npm run build && npm run start": los dos necesitan sus dependencias instaladas
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Backend (backend/.venv)
      working-directory: backend
      run: |
        python -m venv .venv
        .venv/bin/pip install -r requirements.txt

    # La versión de pnpm sale de "packageManager" en package.json
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: pnpm
    - name: Dependencias de la raíz (Playwright)
      run: pnpm install --frozen-lockfile
    - name: Frontend
      working-directory: frontend
      run: npm ci
    - name: Navegadores de Playwright
      run: pnpm exec playwright install --with-deps

    - name: Correr las pruebas e2e
      run: pnpm exec playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: reporte-e2e
        path: |
          docs/reportes/e2e/
          test-results/
        retention-days: 30
